<main class="login">
  <!-- Painel de marca (esquerda) -->
  <section class="marca">
    <div class="marca-topo">
      <img src="/logo.png" alt="Logo + Sustentável" class="logo" />
      <span class="wordmark">Sustentável</span>
    </div>
    <div class="marca-copy">
      <h1>Cada litro soma.</h1>
      <p>Logística reversa de óleo de cozinha usado — administre a operação em um só lugar.</p>
    </div>
  </section>

  <!-- Formulário (direita) -->
  <section class="painel">
    <div class="form-card">
      <h2>Entrar</h2>
      <p class="subtitulo">Bem-vindo de volta. Acesse com suas credenciais.</p>

      @if (erro()) {
        <p-message severity="error" styleClass="erro-msg">{{ erro() }}</p-message>
      }

      <form (ngSubmit)="entrar()">
        <div class="campo">
          <label for="email">E-mail</label>
          <input
            pInputText
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="voce@exemplo.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            required
          />
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <p-iconfield>
            <input
              pInputPassword
              id="senha"
              name="senha"
              autocomplete="current-password"
              placeholder="Sua senha"
              [ngModel]="senha()"
              (ngModelChange)="senha.set($event)"
              [(mask)]="mascararSenha"
              required
            />
            <p-inputicon
              class="toggle-senha"
              role="button"
              tabindex="0"
              [attr.aria-label]="mascararSenha ? 'Mostrar senha' : 'Ocultar senha'"
              (click)="mascararSenha = !mascararSenha"
              (keydown.enter)="mascararSenha = !mascararSenha"
            >
              @if (mascararSenha) {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              } @else {
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 2 12 2 12a18.5 18.5 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <path d="m1 1 22 22" />
                </svg>
              }
            </p-inputicon>
          </p-iconfield>
        </div>

        <button pButton type="submit" class="botao-entrar" [disabled]="carregando()">
          {{ carregando() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </div>
  </section>
</main>
