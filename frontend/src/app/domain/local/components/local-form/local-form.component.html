<app-form-drawer
  [visivel]="visivel()"
  (visivelChange)="visivel.set($event)"
  [titulo]="titulo()"
  [trilha]="trilha()"
  [salvarDesabilitado]="salvarDesabilitado()"
  [salvando]="salvando()"
  rotuloSalvar="Salvar local"
  (salvar)="salvar()"
  (cancelar)="cancelar()"
>
  @if (erro()) {
    <p-message severity="error">{{ erro() }}</p-message>
  }

  <div class="campo">
    <label for="nome">Nome</label>
    <input
      pInputText
      id="nome"
      name="nome"
      placeholder="Ex.: Condomínio Jardim das Acácias"
      [ngModel]="nome()"
      (ngModelChange)="nome.set($event)"
      fluid
    />
  </div>

  <div class="campo">
    <label for="tipo">Tipo</label>
    <p-select
      inputId="tipo"
      name="tipo"
      [options]="tipos"
      optionLabel="label"
      optionValue="value"
      placeholder="Selecione o tipo"
      [ngModel]="tipo()"
      (ngModelChange)="tipo.set($event)"
      fluid
    />
  </div>

  <h3 class="secao">Endereço</h3>

  <div class="campo">
    <label for="cep">CEP</label>
    <input
      pInputText
      pInputMask="99999-999"
      id="cep"
      name="cep"
      placeholder="00000-000"
      [ngModel]="cepMascarado()"
      (ngModelChange)="cepMascarado.set($event)"
      fluid
    />
  </div>

  <div class="par">
    <div class="campo">
      <label for="rua">Rua</label>
      <input
        pInputText
        id="rua"
        name="rua"
        placeholder="Rua das Acácias"
        [ngModel]="rua()"
        (ngModelChange)="rua.set($event)"
        fluid
      />
    </div>

    <div class="campo estreito">
      <label for="numero">Número</label>
      <input
        pInputText
        id="numero"
        name="numero"
        placeholder="320"
        [ngModel]="numero()"
        (ngModelChange)="numero.set($event)"
        fluid
      />
    </div>
  </div>

  <div class="par">
    <div class="campo">
      <label for="complemento">Complemento <span class="opcional">(opcional)</span></label>
      <input
        pInputText
        id="complemento"
        name="complemento"
        placeholder="Bloco B, sala 2"
        [ngModel]="complemento()"
        (ngModelChange)="complemento.set($event)"
        fluid
      />
    </div>

    <div class="campo">
      <label for="bairro">Bairro</label>
      <input
        pInputText
        id="bairro"
        name="bairro"
        placeholder="Santa Mônica"
        [ngModel]="bairro()"
        (ngModelChange)="bairro.set($event)"
        fluid
      />
    </div>
  </div>

  <div class="par">
    <div class="campo">
      <label for="cidade">Cidade</label>
      <input
        pInputText
        id="cidade"
        name="cidade"
        placeholder="Uberlândia"
        [ngModel]="cidade()"
        (ngModelChange)="cidade.set($event)"
        fluid
      />
    </div>

    <div class="campo estreito">
      <label for="uf">UF</label>
      <p-select
        inputId="uf"
        name="uf"
        [options]="ufs"
        placeholder="MG"
        [ngModel]="uf()"
        (ngModelChange)="uf.set($event)"
        [filter]="true"
        fluid
      />
    </div>
  </div>
</app-form-drawer>
