<p-toast />

<section class="pagina-coletas">
  <header class="cabecalho">
    <div class="titulo">
      <button type="button" class="voltar" (click)="voltar()">← Voltar</button>
      <h1>Coletas do ponto</h1>
      <p class="total">Total recolhido: <strong>{{ total() }} L</strong></p>
    </div>
    <button pButton type="button" (click)="novaColeta()">Registrar coleta</button>
  </header>

  <p-table [value]="coletas()" dataKey="id" [loading]="carregando()" [tableStyle]="{ 'min-width': '36rem' }">
    <ng-template #header>
      <tr>
        <th scope="col" style="width: 12rem">Data</th>
        <th scope="col">Litros</th>
        <th scope="col">Registrado por</th>
      </tr>
    </ng-template>
    <ng-template #body let-coleta>
      <tr>
        <td>{{ dataBr(coleta.data) }}</td>
        <td>{{ coleta.litrosReais }} L</td>
        <td>{{ coleta.coletorNome ?? '—' }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="vazio">Nenhuma coleta registrada neste ponto.</td>
      </tr>
    </ng-template>
  </p-table>
</section>

<app-coleta-form
  [visivel]="formVisivel()"
  (visivelChange)="formVisivel.set($event)"
  [pontoId]="pontoId"
  (registrada)="aoRegistrar()"
/>
