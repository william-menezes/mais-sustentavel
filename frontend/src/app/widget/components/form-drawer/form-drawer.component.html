<!--
  closable: por padrão falso — no formulário o fechamento é pelo Cancelar do rodapé, não por um X
  solto no topo. Quem projeta o próprio rodapé (leitura) liga o X, senão o painel não teria saída.
  dismissible=false: clique na máscara não descarta um formulário preenchido por acidente.
-->
<p-drawer
  [visible]="visivel()"
  (visibleChange)="visivel.set($event)"
  [position]="posicao()"
  [style]="dimensao()"
  [modal]="true"
  [closable]="closable()"
  [dismissible]="false"
>
  <ng-template #header>
    <div class="cabecalho">
      @if (trilha().length) {
        <p-breadcrumb [model]="trilha()" />
      }
      <h2>{{ titulo() }}</h2>
    </div>
  </ng-template>

  <div class="corpo">
    <ng-content />
  </div>

  <ng-template #footer>
    <!--
      Rodapé projetável com conteúdo de reserva: sem um `<div acoes>` do hospedeiro valem os botões
      de formulário abaixo — é o que mantém o local-form funcionando sem mudar uma linha.
    -->
    <ng-content select="[acoes]">
      <div class="acoes">
        <button
          pButton
          type="button"
          severity="secondary"
          variant="outlined"
          data-testid="cancelar"
          (click)="aoCancelar()"
        >
          Cancelar
        </button>
        <button
          pButton
          type="button"
          data-testid="salvar"
          [disabled]="salvarDesabilitado() || salvando()"
          (click)="salvar.emit()"
        >
          {{ salvando() ? 'Salvando…' : rotuloSalvar() }}
        </button>
      </div>
    </ng-content>
  </ng-template>
</p-drawer>
