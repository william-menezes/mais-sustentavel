<header class="header">
  <div class="esquerda">
    <button type="button" class="icone-btn menu" (click)="menuAlternado.emit()" aria-label="Alternar menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>

    <nav class="trilha" aria-label="Trilha de navegação">
      <ol>
        @for (migalha of trilha(); track migalha.label; let ultimo = $last) {
          <li class="migalha">
            @if (ultimo) {
              <span class="migalha-atual" aria-current="page">{{ migalha.label }}</span>
            } @else if (migalha.link) {
              <a [routerLink]="migalha.link" class="migalha-link">{{ migalha.label }}</a>
            } @else {
              <span class="migalha-link">{{ migalha.label }}</span>
            }
            @if (!ultimo) {
              <svg class="separador" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            }
          </li>
        }
      </ol>
    </nav>
  </div>

  <div class="direita">
    <button type="button" class="icone-btn sino" (click)="notificacoes.emit()" aria-label="Notificações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
    </button>

    <button type="button" class="usuario" (click)="perfil.emit()">
      <span class="usuario-avatar" aria-hidden="true">{{ inicial() }}</span>
      <span class="usuario-nome">{{ usuarioNome() }}</span>
    </button>
  </div>
</header>
