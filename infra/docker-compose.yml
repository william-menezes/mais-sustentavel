name: mais-sustentavel

# Ambiente de DESENVOLVIMENTO local.
# Em homologação/produção o banco é o Supabase (Postgres gerenciado, com RLS)
# e a API roda na Render — ver docs/workflow.md e constitution.md (Art. 1.2).

services:
  db:
    image: postgres:16
    container_name: mais-sustentavel-db
    environment:
      POSTGRES_DB: mais_sustentavel
      POSTGRES_USER: mais_sustentavel
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mais_sustentavel}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mais_sustentavel -d mais_sustentavel"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: mais-sustentavel-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mais_sustentavel
      SPRING_DATASOURCE_USERNAME: mais_sustentavel
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mais_sustentavel}
      PORT: 8080
      # Gestor inicial semeado no DEV (sobrescreva via infra/.env se quiser).
      # Em produção, defina SEED_GESTOR_EMAIL/SEED_GESTOR_SENHA no painel da Render (segredos).
      SEED_GESTOR_EMAIL: ${SEED_GESTOR_EMAIL:-gestor@maissustentavel.local}
      SEED_GESTOR_SENHA: ${SEED_GESTOR_SENHA:-Gestor@123}
      # CA-02: base da URL embutida no QR dos pontos (dev = frontend local).
      APP_PONTO_BASE_URL: ${APP_PONTO_BASE_URL:-http://localhost:4200}
    ports:
      - "8080:8080"

volumes:
  db-data: